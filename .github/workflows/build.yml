# =============================================================================
# Сборка обеих целей проекта на каждый push в main и на каждый pull request.
#
# Целевой фреймворк выбирается в csproj по операционной системе сборки:
# на Windows это net10.0-windows (WPF), на Linux net10.0 (Avalonia).
# Поэтому одной машиной обе цели не проверить: сборка на Windows не
# компилирует ни одного файла *.Avalonia.cs, а сборка на Linux не
# компилирует WPF-часть. Отсюда две задачи, по одной на систему.
#
# Каждая задача вызывает тот же скрипт, которым проект собирается вручную
# (build.ps1 и build.sh), чтобы CI и локальная сборка не разъезжались:
# в Release-конфигурации заданы RuntimeIdentifier и single-file, и оба
# скрипта их гасят для обычной сборки.
# =============================================================================
name: Сборка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Сборке хватает чтения: ничего не публикует и не пишет в репозиторий.
permissions:
  contents: read

# Новый коммит в ветку отменяет незаконченный прогон по ней же,
# иначе на активной ветке копится очередь параллельных сборок.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (WPF, net10.0-windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Сборка Release
        shell: pwsh
        working-directory: Workspace1C
        run: ./build.ps1 -Configuration Release

      - name: Регрессионные тесты
        run: dotnet test "Workspace1C.Tests/Workspace1C.Tests.csproj" -c Release -p:RuntimeIdentifier= -p:SelfContained=false -p:PublishSingleFile=false --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # Упавшие тесты — в аннотации прогона (видны на странице Actions и через API).
      - name: Отчёт об упавших тестах
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$x = Get-Content $_.FullName
            # GitHub показывает не больше 10 аннотаций на шаг — первой идёт сводная
            # со списком ВСЕХ упавших тестов (видна через API check-runs/annotations).
            $failed = @($x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | ForEach-Object { $_.testName })
            if ($failed.Count -gt 0) {
              Write-Output "::error title=Упавшие тесты ($($failed.Count))::$($failed -join '; ')"
            }
            $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | Select-Object -First 40 | ForEach-Object {
              $msg = ($_.Output.ErrorInfo.Message -replace '\r?\n', ' ')
              if ($msg.Length -gt 600) { $msg = $msg.Substring(0, 600) }
              Write-Output "::error title=$($_.testName)::$msg"
            }
          }

  linux:
    name: Linux (Avalonia, net10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Сборка Release
        working-directory: Workspace1C
        run: ./build.sh Release

      - name: Регрессионные тесты
        run: dotnet test "Workspace1C.Tests/Workspace1C.Tests.csproj" -c Release -p:RuntimeIdentifier= -p:SelfContained=false -p:PublishSingleFile=false --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # Упавшие тесты — в аннотации прогона (видны на странице Actions и через API).
      - name: Отчёт об упавших тестах
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$x = Get-Content $_.FullName
            # GitHub показывает не больше 10 аннотаций на шаг — первой идёт сводная
            # со списком ВСЕХ упавших тестов (видна через API check-runs/annotations).
            $failed = @($x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | ForEach-Object { $_.testName })
            if ($failed.Count -gt 0) {
              Write-Output "::error title=Упавшие тесты ($($failed.Count))::$($failed -join '; ')"
            }
            $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | Select-Object -First 40 | ForEach-Object {
              $msg = ($_.Output.ErrorInfo.Message -replace '\r?\n', ' ')
              if ($msg.Length -gt 600) { $msg = $msg.Substring(0, 600) }
              Write-Output "::error title=$($_.testName)::$msg"
            }
          }
