define myDocumentRoot "${SRVROOT}/htdocs/${OneCPort}"

# 1c publication
Alias "/Demo" "${myDocumentRoot}/Demo/"
<Directory "${myDocumentRoot}/Demo/">
    AllowOverride All
    Options None
    Require all granted
    SetHandler 1c-application
    ManagedApplicationDescriptor "${myDocumentRoot}/Demo/default.vrd"
</Directory>

# 1c publication
Alias "/ErrorLogger" "${myDocumentRoot}/ErrorLogger/"
<Directory "${myDocumentRoot}/ErrorLogger/">
    AllowOverride All
    Options None
    Require all granted
    SetHandler 1c-application
    ManagedApplicationDescriptor "${myDocumentRoot}/ErrorLogger/default.vrd"
</Directory>

# 1c publication
Alias "/LK" "${myDocumentRoot}/LK/"
