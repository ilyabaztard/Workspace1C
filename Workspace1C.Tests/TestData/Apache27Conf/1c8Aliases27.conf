# 1c publication
Alias "/showScore" "${myDocumentRoot}/showScore/"
<Directory "${myDocumentRoot}/showScore/">
    AllowOverride All
    Options None
    Require all granted
    SetHandler 1c-application
    ManagedApplicationDescriptor "${myDocumentRoot}/showScore/default.vrd"
	Redirect 302 /showScore/ru/e1csys/mngsrv/favicon.ico /showScoreRes/icon.png
	Redirect 302 /showScore/e1csys/mngsrv/favicon.ico /showScoreRes/icon.png
	Redirect 302 /showScore/ru/manifest.json /showScoreRes/manifest.json
	Redirect 302 /showScore/manifest.json /showScoreRes/manifest.json
</Directory>

Alias "/showScoreRes" "${myDocumentRoot}/showScoreRes/"
<Directory "${myDocumentRoot}/showScoreRes/">
    AllowOverride All
    Require all granted
</Directory>

